[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    requires_torch: tests that import torch and need an interactive session with GPU/Metal access
filterwarnings =
    # joblib uses torch.load internally without weights_only=True; not our code, safe to suppress
    ignore:.*weights_only.*:FutureWarning
# Report options: JUnit XML for CI + verbose short summary in terminal
addopts =
    --junit-xml=reports/test_report.xml
    -v
    --tb=short
    --no-header
    -q
